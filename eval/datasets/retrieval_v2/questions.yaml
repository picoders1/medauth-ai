# Retrieval ground truth, version 2. INDEPENDENT of retrieval_eval_v1.
#
# WHY A NEW SET
#
# Phase 3 measured v1 and found it could not fail. 21 of 33 criteria covered, no
# negative queries, no ambiguous queries, and resolution accuracy of 1.0000 that
# reflected queries built from the linkage table rather than a solved problem.
# Recall@3 was 0.9524 across every encoder and reranker arm, which is the real
# finding: a set on which six configurations tie measures nothing about any of
# them.
#
# v1 is NOT modified and NOT deleted. It remains the record of what was measured
# in Phase 3, and its numbers stay attached to it.
#
# WHAT IS DIFFERENT
#
#   * Graded relevance. RELEVANT / PARTIALLY_RELEVANT / NOT_RELEVANT, because a
#     query whose answer is spread across two sections is not well described by
#     one binary target.
#   * Negative queries. Questions the corpus genuinely does not answer. The
#     system must not assume every query has an answer, and nothing in v1 tested
#     that.
#   * Ambiguity. Queries two sections could plausibly answer, labelled so.
#   * Distractors. Queries whose strongest lexical match is the wrong section.
#   * All 35 criteria covered, including the two 410.32 exception conditions.
#
# AUTHORING RULES, FOLLOWED FOR EVERY ENTRY
#
#   1. Query text is written the way a reviewer would ask, NOT lifted from the
#      regulation. A query copied from its target measures string matching. Word
#      overlap is asserted by test.
#   2. Every query states `reason_for_inclusion`. A question with no reason to
#      exist is padding, and padding inflates a denominator.
#   3. Relevance is judged from the section's subject matter, not from what any
#      retriever returned. No label was set or changed after seeing a result.
#   4. Chunk ids are NOT pinned. They change whenever chunking changes, and
#      pinning them would measure the chunker against itself.
#
# WHAT THIS SET STILL CANNOT DO
#
# It is authored by the same non-clinician who transcribed the criteria, against
# a corpus of five regulations. It cannot establish that retrieval works on real
# coverage determinations, and its size still bounds the precision of any
# comparison - see docs/evaluation/retrieval-evaluation-methodology.md.

version: '2'
corpus: data/cms
corpus_kind: authoritative
corpus_source: eCFR API (Office of the Federal Register), public domain
criteria_inventory: data/criteria/inventory.jsonl
authored_by: engineering
authored_by_role: Software engineer. Not a clinician, not a coverage analyst.
authored_at: '2026-08-23'
supersedes: null   # v1 remains valid for its own recorded measurements

relevance_labels:
  RELEVANT: The section answers the question.
  PARTIALLY_RELEVANT: >
    The section bears on the question but does not answer it - context a reviewer
    would want, not the answer they asked for.
  NOT_RELEVANT: Everything else. The default; not enumerated per query.

questions:

