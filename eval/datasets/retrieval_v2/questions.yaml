# ===========================================================================
# AMBIGUOUS - more than one section legitimately answers
# ===========================================================================

- id: v2-030
  category: AMBIGUOUS
  text: Who has to be supervising while the test is carried out?
  reason_for_inclusion: >
    410.32 sets a general supervision rule in paragraph (b) and a specific one for
    portable x-ray. Without knowing the modality neither is wrong, so both are
    RELEVANT. A set where every query has one right answer cannot detect a
    retriever that is confidently over-specific.
  procedure_code: Q0092
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect:
    policy_id: 42 CFR 410.32
    revision_id: '2026-08-13'
    criterion_id: 42_CFR_410_32_2026_08_13_C03
    relevance:
      - {section_path: Paragraph (b), label: RELEVANT}
      - {section_path: Portable x-ray services, label: RELEVANT}
  ambiguity_note: >
    Genuinely two-sided. The query does not say whether the test is portable
    x-ray, and that fact is what selects between the sections.

- id: v2-031
  category: AMBIGUOUS
  text: What are the rules about the physician who signs off on this?
  reason_for_inclusion: >
    In 410.33 "the physician" is both the ordering physician and the supervising
    physician, in different sections. The query does not disambiguate and neither
    reading is wrong.
  procedure_code: R0075
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect:
    policy_id: 42 CFR 410.33
    revision_id: '2026-08-13'
    criterion_id: 42_CFR_410_33_2026_08_13_C03
    relevance:
      - {section_path: Supervising physician, label: RELEVANT}
      - {section_path: Ordering of tests, label: RELEVANT}
  ambiguity_note: >
    "Signs off" maps to ordering in one reading and to supervision in the other.
    Both are in scope for the same procedure code.

- id: v2-032
  category: AMBIGUOUS
  text: What does the plan have to say?
  reason_for_inclusion: >
    410.61 splits plan requirements across establishment, content and changes.
    Content is the primary answer; the other two bear on it.
  procedure_code: G0295
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect:
    policy_id: 42 CFR 410.61
    revision_id: '2026-08-13'
    criterion_id: 42_CFR_410_61_2026_08_13_C04
    relevance:
      - {section_path: Content of the plan, label: RELEVANT}
      - {section_path: Establishment of the plan, label: PARTIALLY_RELEVANT}
      - {section_path: Changes in the plan, label: PARTIALLY_RELEVANT}
  ambiguity_note: >
    Three sections describe the same document. Graded labels exist for exactly
    this shape - binary relevance would have to call two of them wrong.

# ===========================================================================
# NEGATIVE - the corpus does not answer these, and must not pretend to
# ===========================================================================

- id: v2-040
  category: NEGATIVE
  text: What is the patient's coinsurance percentage for this item?
  reason_for_inclusion: >
    410.38 sets conditions of payment; it says nothing about beneficiary cost
    sharing, which lives in a different part of the regulation entirely. A vector
    search always returns something, so the question is whether it returns
    something *confidently*.
  procedure_code: K0898
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect_no_relevant: true
  negative_reason: >
    No section of 410.38 addresses coinsurance, deductibles or beneficiary
    liability. Every chunk in the resolved scope is NOT_RELEVANT.

- id: v2-041
  category: NEGATIVE
  text: How many days do we have to appeal a denied claim?
  reason_for_inclusion: >
    Appeals are procedurally elsewhere in 42 CFR. The lexical overlap with
    "denied" and "claim" is high enough to tempt a retriever.
  procedure_code: R0070
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect_no_relevant: true
  negative_reason: >
    410.32 covers ordering and supervision of diagnostic tests. It contains no
    appeal rights, deadlines or procedures.

- id: v2-042
  category: NEGATIVE
  text: Which modifier should be appended to this HCPCS code?
  reason_for_inclusion: >
    Coding guidance is not regulation. Billing questions are the single most
    common thing a prior-authorization tool is wrongly asked, so a confident
    answer here would be a realistic and damaging failure.
  procedure_code: E1390
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect_no_relevant: true
  negative_reason: >
    No modifier, code descriptor or billing instruction appears anywhere in the
    corpus - by design, since CPT(R) descriptor text is not redistributed here.

- id: v2-043
  category: NEGATIVE
  text: What is the reimbursement rate for a power wheelchair in 2026?
  reason_for_inclusion: >
    Fee schedules are not in 42 CFR 410.38. Shares "power wheelchair" with the
    linkage table, so resolution succeeds and only ranking can fail.
  procedure_code: K0898
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect_no_relevant: true
  negative_reason: >
    The regulation states conditions of payment, never amounts. No section
    contains a rate, fee or dollar figure.

- id: v2-044
  category: NEGATIVE
  text: Does the patient need a second opinion before this is approved?
  reason_for_inclusion: >
    Plausible-sounding prior-authorization requirement that this corpus simply
    does not impose. Tests whether the retriever invents a requirement by finding
    the nearest requirement-shaped text.
  procedure_code: G0295
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect_no_relevant: true
  negative_reason: >
    410.61 requires a plan of treatment. It imposes no second-opinion, prior
    authorization or concurrent review condition.

- id: v2-045
  category: NEGATIVE
  text: What are the accreditation requirements for the supplier's warehouse?
  reason_for_inclusion: >
    Supplier standards live in part 424 and part 486, not here. High topical
    adjacency with 410.33's certification standards makes this a hard negative
    rather than an obvious one.
  procedure_code: K0012
  code_system: HCPCS
  as_of: '2026-08-20'
  jurisdiction: null
  expect_no_relevant: true
  negative_reason: >
    410.38 addresses the item and the order, not supplier facilities. The
    resolved scope contains nothing about premises or accreditation.

