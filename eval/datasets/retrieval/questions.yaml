# Retrieval ground truth, version 3 - built against the AUTHORITATIVE corpus.
#
# Query text is hand-authored in the phrasing a reviewer would use, NOT lifted
# from the regulation it targets. A query copied from its target makes retrieval
# look excellent and measures string matching; overlap is asserted by test.
#
# Targets are (policy, revision, section, criterion_id). The criterion link is
# verified against data/criteria/inventory.jsonl by test, so a renamed criterion
# breaks the build rather than silently invalidating the set.
#
# Chunk ids are deliberately NOT pinned: they change whenever chunking changes,
# and pinning them would measure the chunker against itself.

version: '3'
corpus: data/cms
corpus_kind: authoritative
corpus_source: eCFR API (Office of the Federal Register), public domain
criteria_inventory: data/criteria/inventory.jsonl
