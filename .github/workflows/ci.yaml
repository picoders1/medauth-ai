# Phase 0 subset of the pipeline. Integration, kubeconform, Trivy, gitleaks and
# the evaluation regression land in Phase 9 (ADR-019).
#
# CI must pass from a clean clone with NO API key and NO network egress. Tests
# that call a model are marked and skipped by default, so a fork does not
# silently lose coverage.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 38 of the `api` and `security` tests reach a real database - the reviewer
    # workflow, the append-only audit triggers, the case lifecycle. They are not
    # marked `integration` because they do not need the API container or the
    # firewall, only PostgreSQL.
    #
    # Until this service existed **CI could not have passed**: the same subset below
    # failed 38 tests with ConnectionRefusedError on every run. It went unnoticed
    # because the branch had never been pushed, which is exactly how the compliance
    # -claim guard was also found broken.
    #
    # The alternative was to make those tests skip when no database is reachable, as
    # the `integration` marker already does. Rejected: skipping is right for a corpus
    # this repository is not allowed to redistribute, and wrong for a dependency a
    # runner can start in seconds. It would have turned a red CI green by removing
    # 38 security tests from it.
    #
    # pgvector rather than stock postgres because migration 0001 enables the
    # extension.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medauth
          POSTGRES_PASSWORD: medauth
          POSTGRES_DB: medauth
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U medauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Lockfile is fresh
        run: uv lock --check

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check (strict)
        run: uv run mypy app

      # Boundary-protocol test doubles. Narrow and deliberate - the scope note lives
      # in pyproject.toml. A double that does not satisfy the contract it stands in
      # for is testing a different object, and that went unnoticed for a whole phase.
      - name: Type-check boundary doubles
        run: uv run mypy --strict tests/support_slice.py tests/gateway_contract.py

      # The restricted CFR corpus is NOT in the repository (AMA-copyright
      # descriptors, ADR-003), so this runner has none. Corpus-dependent tests skip
      # with a reason naming the missing files - `-rs` prints those reasons, so the
      # log distinguishes RUN from SKIPPED rather than showing one green tick.
      # The tests connect to `medauth_test`, which the service does not create.
      # Schema comes from the migrations rather than from metadata.create_all, so CI
      # exercises the same DDL a deployment applies - including the append-only
      # triggers, which a metadata-driven schema would silently omit.
      - name: Database schema
        env:
          PGPASSWORD: medauth
        run: |
          psql -h localhost -p 5435 -U medauth -d medauth \
            -c "CREATE DATABASE medauth_test"
          MEDAUTH_DATABASE_URL="postgresql+asyncpg://medauth:medauth@localhost:5435/medauth_test" \
            uv run alembic upgrade head

      - name: Test
        run: uv run pytest -m "unit or api or security" -q -rs

      # The suite says the code does what the tests check. This says the tests would
      # notice if it stopped. Three vacuous safety tests have been found by hand in
      # this project; this makes that check repeatable.
      - name: Safety mutations are caught
        run: uv run python scripts/mutation_guard.py

      - name: No secrets in the tree
        run: |
          set -e
          # Provider hosts, model ids and credentials are deployment values and
          # must appear nowhere in the repository (ADR-016, ADR-017).
          if grep -rIn -E 'sk-[A-Za-z0-9]{16,}' --exclude-dir=.git .; then
            echo "::error::a credential-shaped literal is committed"; exit 1
          fi
          for f in $(git ls-files '*.md' '*.yaml' '*.yml' '*.toml' '*.py'); do
            if grep -qE '"(APPROVE|DENY)_RECOMMENDED"' "$f" && \
               echo "$f" | grep -qE '^app/(intake|adjudication)/'; then
              echo "::error::$f names an outcome in a verdict-only package"; exit 1
            fi
          done

      - name: No compliance claims
        run: |
          # `ci.yaml` and the test that ENFORCES this rule are both exempt: each has
          # to quote the banned phrases in order to ban them. The exemption is by
          # filename, not by a marker heuristic, because a bare list entry
          # (`"hipaa compliant",`) carries no surrounding prose to match on - which is
          # exactly why this guard had been failing since Phase 3, unnoticed until the
          # branch was first pushed.
          #
          # `test_ground_truth_integrity.py` does the contextual version of this check
          # properly: it requires a prohibiting marker within a window of the phrase.
          # This grep is the cruder outer net over everything else.
          if grep -rIn -iE 'hipaa[ -]compliant|compliant with hipaa' \
             --exclude-dir=.git --exclude=ci.yaml \
             --exclude=test_ground_truth_integrity.py . \
             | grep -vE 'never write|refused|Refused|must not'; then
            echo "::error::a compliance claim is present"; exit 1
          fi
