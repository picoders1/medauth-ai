# TLS termination in front of MEDAUTH, matching the intended production model:
# the application speaks plain HTTP on a private network and never holds a
# certificate. This is a reverse proxy standing in for whatever an environment
# actually uses - an ingress controller, an ALB, a service mesh sidecar.
#
# MEDAUTH is unchanged by it. That is the property being demonstrated: HTTPS is a
# deployment concern, and moving it does not touch authentication, authorization or
# audit.
server {
    listen 8444 ssl;
    server_name api.medauth.localhost;

    ssl_certificate     /etc/nginx/tls/api.crt;
    ssl_certificate_key /etc/nginx/tls/api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://api:8010;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Authorization header must survive the hop untouched: the bearer token
        # is verified by MEDAUTH, not by the proxy. A proxy that validated tokens
        # would become a second, weaker authenticator.
        proxy_pass_request_headers on;
    }
}
