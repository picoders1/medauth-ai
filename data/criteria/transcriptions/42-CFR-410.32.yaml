schema_version: "1"
curator: engineering
curator_role: >
  Software engineer, NOT a clinician and NOT a coverage analyst. These are
  transcriptions of regulatory text, not clinical judgements. Every criterion is
  span-verified against the authoritative source, which proves the transcription
  is faithful - it does NOT establish that the criterion set is complete or that
  the interpretation is clinically correct.
curated_at: 2026-08-23
policy_id: "42 CFR 410.32"
revision_id: "2026-08-13"
source_url: https://www.ecfr.gov/current/title-42/section-410.32
notes: >
  Ordering and supervision conditions for diagnostic tests. Exercises the
  "who ordered it and were they treating the patient" class of criterion, which
  imaging prior authorization turns on.

criteria:
  - ordinal: 1
    criterion_type: REQUIRED
    fact_key: ordered_by_treating_physician
    summary: Ordered by the physician treating the beneficiary
    authoritative_text: "must be ordered by the physician who is treating the beneficiary"
    normalized_interpretation: >
      The ordering physician must be the one furnishing a consultation or treating
      the beneficiary for the specific medical problem.
    source_section: Ordering diagnostic tests
    applicability: All diagnostic x-ray, laboratory and other diagnostic tests

  - ordinal: 2
    criterion_type: REQUIRED
    fact_key: results_used_in_management
    summary: The ordering physician uses the results in managing the problem
    authoritative_text: "uses the results in the management of the beneficiary's specific medical problem"
    normalized_interpretation: >
      The test must inform management of the specific problem, not be ordered
      without a documented use for the result.
    source_section: Ordering diagnostic tests
    applicability: All diagnostic tests

  - ordinal: 3
    criterion_type: REQUIRED
    fact_key: appropriate_supervision_level
    summary: Furnished under the appropriate level of physician supervision
    authoritative_text: "must be furnished under the appropriate level of supervision"
    normalized_interpretation: >
      General, direct or personal supervision as designated for the test.
      Services furnished without it are not reasonable and necessary.
    source_section: Paragraph (b)
    applicability: Diagnostic tests payable under the physician fee schedule

  - ordinal: 4
    criterion_type: REQUIRED
    fact_key: portable_xray_general_supervision
    summary: Portable x-ray furnished under general physician supervision
    authoritative_text: "furnished under the general supervision of a physician"
    normalized_interpretation: >
      Applies only to portable x-ray services furnished in a place of residence
      used as the patient's home.
    source_section: Portable x-ray services
    applicability: Portable x-ray services only

  # --- 42 CFR 410.32(a)(1): the mammography exception ------------------------
  #
  # Added in Phase 4. Phase 3 identified this provision as one of seven confirmed
  # gaps: it states an alternative route through the ordering requirement in
  # ordinal 1, and while it was absent the decision logic could only read that
  # requirement as absolute - denying a case the regulation permits.
  #
  # Both conditions are EXCEPTION_CONDITION, not REQUIRED. Failing one does not
  # deny; it means the ordinary rule in ordinal 1 governs after all. They are
  # inert unless a policy's declared logic places them on a pathway, and
  # 42 CFR 410.32's logic does exactly that (see data/policy_logic/).
  #
  # Transcribed by the same non-clinician process as everything above, and
  # span-verified against the same authoritative text. That proves faithfulness,
  # not clinical correctness, and does not close OD-19.

  - ordinal: 5
    criterion_type: EXCEPTION_CONDITION
    fact_key: interpreting_physician_qualified
    summary: Ordering physician meets the interpreting-physician qualifications
    authoritative_text: "meets the qualification requirements for an interpreting physician"
    normalized_interpretation: >
      The ordering physician satisfies the interpreting-physician qualification
      requirements of section 354 of the Public Health Service Act as provided in
      42 CFR 410.34(a)(7). The referenced requirements are NOT transcribed here,
      so this criterion is not independently checkable - see R-51.
    source_section: Ordering diagnostic tests
    applicability: Diagnostic mammography ordered from screening findings

  - ordinal: 6
    criterion_type: EXCEPTION_CONDITION
    fact_key: diagnostic_mammogram_from_screening
    summary: A diagnostic mammogram ordered on screening-mammogram findings
    authoritative_text: "may order a diagnostic mammogram based on the findings of a screening mammogram"
    normalized_interpretation: >
      The order is for a diagnostic mammogram and arises from the findings of a
      screening mammogram. Both halves must hold: a diagnostic mammogram ordered
      for some other reason is not within this exception.
    source_section: Ordering diagnostic tests
    applicability: Diagnostic mammography ordered from screening findings

  # --- 42 CFR 410.32(b)(3): levels of supervision -----------------------------
  #
  # Added in Phase 7 to address R-51: criterion C03 ("furnished under the
  # appropriate level of supervision") invokes the levels set out in (b)(3), which
  # was not transcribed, so C03's evidence set could not contain the standard it
  # was measured against.
  #
  # WHAT (b)(3) ACTUALLY ESTABLISHES, read from the source:
  #
  #   1. A BASELINE that applies to every test in scope - "at least a general level
  #      of supervision". Checkable, and transcribed below as C07.
  #
  #   2. An ESCALATION - "some of these tests also require either direct or
  #      personal supervision". WHICH tests is NOT stated in this regulation; it
  #      comes from the physician fee schedule's supervision indicator, which is
  #      not in this corpus.
  #
  #   3. DEFINITIONS of general, direct and personal supervision in (b)(3)(i),
  #      (ii) and (iii). Those are definitions rather than conditions - nothing
  #      can satisfy or fail a definition - so they are NOT transcribed as
  #      criteria. They are already chunked and retrievable within this policy
  #      version, which is what makes them usable as evidence.
  #
  # So transcription closes part of C03's dependency and cannot close all of it.
  # Determining "the appropriate level" for a given test requires data this
  # document does not contain. That is recorded, not worked around.
  #
  # C07 is SOURCE_VERIFIED. Whether it is the RIGHT criterion, and whether it
  # makes C03 adjudicable, is QUALIFIED_REVIEW_PENDING - see
  # docs/data/410-32-b3-review.md.

  - ordinal: 7
    criterion_type: REQUIRED
    fact_key: at_least_general_supervision
    summary: Furnished under at least a general level of supervision
    authoritative_text: "must be furnished under at least a general level of supervision"
    normalized_interpretation: >
      Every diagnostic test subject to this provision and payable under the
      physician fee schedule must be furnished under at least general supervision,
      as defined in 42 CFR 410.32(b)(3)(i). This is the FLOOR, not the applicable
      level: some tests require direct or personal supervision instead, and which
      tests those are is determined by the physician fee schedule's supervision
      indicator, which is not part of this regulation.
    source_section: Paragraph (b)
    applicability: Diagnostic tests payable under the physician fee schedule

  - ordinal: 8
    criterion_type: EXCEPTION_CONDITION
    fact_key: rra_or_rpa_performed
    summary: Performed by a certified RRA or RPA, permitting direct in place of personal
    authoritative_text: "may be furnished under a direct level of physician supervision"
    normalized_interpretation: >
      A test performed by a registered radiologist assistant or radiology
      practitioner assistant, certified as 42 CFR 410.32(b)(4) requires, may be
      furnished under DIRECT supervision where personal supervision would otherwise
      be required - to the extent state law and scope of practice permit. An
      EXCEPTION_CONDITION: failing it does not deny, it means the ordinary
      supervision level governs.
    source_section: Paragraph (b)
    applicability: Diagnostic tests otherwise requiring personal supervision
