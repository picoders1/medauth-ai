# ============================================================================
# WHAT IS DELIBERATELY ABSENT
# ============================================================================
#
# The three UNDATED determinations — NCD 150.1, 250.1 and 290.2 — carry no links.
# They cannot be temporally resolved at all (the CMS API publishes prose where an
# effective date belongs), so a link to them could never fire. Adding one would
# create linkage that looks like coverage and behaves like nothing.
#
# NCD 260.5 and NCD 220.6.5 carry no links either: their subject matter
# (multi-visceral transplantation, FDG PET for lymphoma) is coded largely in CPT,
# which is AMA-copyrighted and is not redistributed here (ADR-003).
