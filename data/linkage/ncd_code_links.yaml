# NCD PROCEDURE-CODE LINKAGE — HUMAN-CURATED, NOT AUTHORITATIVE.
#
# ============================================================================
# WHY THIS FILE HAS TO EXIST, AND WHY IT CANNOT BE AUTHORITATIVE
# ============================================================================
#
# The CMS Coverage API's NCD record carries NO procedure-code field. Nineteen
# fields, none of them codes — verified by live probe, recorded in
# docs/coverage/ncd-data-model.md. So a determination cannot be resolved from a
# procedure code unless someone supplies the mapping, and the only someone
# available is us.
#
# That makes every link here a JUDGEMENT ABOUT SUBJECT MATTER, made by a software
# engineer who is not a clinician and not a certified coder. It is the same
# position 42 CFR is in (see policy_code_links.yaml) and for the same reason.
#
#   NOTHING HERE MAY BE PRESENTED AS CMS-SUPPLIED LINKAGE.
#
# ============================================================================
# THE THREE LEVELS OF AUTHORITY
# ============================================================================
#
#   SOURCE_STATED         the source document states the relationship.
#                         Authoritative. NO LINK IN THIS FILE IS THIS, and none
#                         can be while the API publishes no code field.
#
#   HUMAN_CURATED         a person judged the code falls within the policy's
#                         subject matter. Admissible for resolution; NOT
#                         authoritative until a qualified reviewer verifies it.
#                         `review_status` tracks that separately.
#
#   ENGINEERING_INFERRED  the link rests on resemblance rather than on a
#                         judgement about the text. REFUSED by production
#                         resolution — applicability from similarity is exactly
#                         what ADR-004 exists to prevent.
#
# `review_status` is a different axis from provenance. Verifying a curated link
# confirms a judgement; it does not turn that judgement into a statement by CMS.
#
# ============================================================================
# WHAT A LINK DOES AND DOES NOT MEAN
# ============================================================================
#
# A code appearing here means "this determination is about this kind of item, so
# a request for it should surface this determination for a human to read".
#
# It does NOT mean the item is covered. Every acquired NCD currently resolves to
# CoverageStatus.UNKNOWN because no reviewer has recorded what any determination
# establishes (OD-26). A link makes a determination REACHABLE, not APPLIED.
#
# Codes are HCPCS Level II (public domain). No AMA CPT code appears here.

schema_version: "1"
linkage_class: HUMAN_CURATED_ENGINEERING_LINKAGE
applies_to_policy_type: NCD
curator: engineering
curator_role: Software engineer. Not a clinician, not a certified coder.
curated_at: 2026-08-23
code_authority: NLM Clinical Tables API (code existence and description only)
source_of_linkage: >
  None. The CMS Coverage API publishes no procedure-code field for NCDs, so every
  link below is a curation decision and is labelled as one.
default_provenance: HUMAN_CURATED
default_review_status: PENDING

