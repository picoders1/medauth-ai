# ============================================================================
# HUMAN-CURATED ENGINEERING LINKAGE
# ============================================================================
#
# THIS IS NOT CMS POLICY LANGUAGE. It must never be presented as such.
#
# 42 CFR states conditions of payment; it does not enumerate procedure codes the
# way a Local Coverage Determination does. The mapping below is therefore an
# ENGINEERING ARTEFACT: a judgement by a non-clinician about which codes plausibly
# fall within a regulation's subject matter, made so that deterministic policy
# resolution has something to resolve on.
#
# What each part is authoritative for:
#
#   code + description   NLM Clinical Tables. Authoritative for EXISTENCE only.
#   regulation text      eCFR. Authoritative.
#   THIS MAPPING         Curated. Authoritative for NOTHING.
#
# A code appearing here does not mean the item is covered. Coverage depends on the
# criteria, which are adjudicated per case. `confidence` records how defensible the
# subject-matter match is, and `low` entries exist deliberately so the corpus
# contains linkage the system should be sceptical of.
#
# Codes are Level II HCPCS (public domain). No AMA CPT code appears here.

