[project]
name = "medauth-ai"
version = "0.1.0"
description = "Evidence-grounded prior-authorization decision support. Models produce verdicts; code produces the decision."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "MEDAUTH AI contributors" }]
keywords = ["healthcare", "prior-authorization", "rag", "decision-support", "clinical-nlp"]

# Runtime baseline. Every entry has a reason; heavy stacks live in optional
# extras below so the default image does not carry them (ADR-019).
dependencies = [
    "fastapi>=0.115,<1.0",              # ASGI framework, async-first
    "uvicorn[standard]>=0.30,<1.0",     # ASGI server
    "pydantic>=2.9,<3.0",               # domain types + closed output schemas (ADR-010)
    "pydantic-settings>=2.5,<3.0",      # environment configuration, SecretStr (ADR-017)
    "httpx>=0.27,<1.0",                 # pooled async client -> llm-firewall (ADR-016)
    "structlog>=24.4,<26.0",            # structured logging, redaction at the sink (ADR-018)
    "pyyaml>=6.0,<7.0",                 # decision policy + environment overlays (ADR-017)
    "sqlalchemy[asyncio]>=2.0.35,<3.0", # corpus, cases, audit (ADR-005)
    "asyncpg>=0.29,<1.0",               # async PostgreSQL driver
    "pgvector>=0.3,<1.0",               # vector column type for SQLAlchemy (ADR-005)
    "alembic>=1.13,<2.0",               # schema is versioned, never auto-created
    "prometheus-client>=0.21,<1.0",     # /metrics exposition (ADR-018)
]

[project.optional-dependencies]
# Phase 1: local encoders. Do NOT traverse the firewall - it exposes no
# /v1/embeddings, and inspecting a corpus embedding serves no security purpose.
retrieval = [
    "sentence-transformers>=3.0,<6.0",
    "torch>=2.4,<3.0",
]
# Phase 6: evaluation harness.
eval = [
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
]
# Phase 8: opt-in tracing. Langfuse is a compose overlay, never required.
otel = [
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "respx>=0.21,<1.0",                 # httpx mocking; no network in unit tests
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-pyyaml>=6.0,<7.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "S",     # bandit / security
    "ASYNC", # no blocking calls on the event loop
    "UP",    # pyupgrade
    "C4",    # comprehensions
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval"]

[tool.ruff.lint.per-file-ignores]
# RUF001: this module is a table of Unicode confusables used for evasion.
# Flagging them as "ambiguous" is correct in general and exactly backwards here.
"app/core/normalize.py" = ["RUF001"]
# The ambiguity IS the subject matter: these fixtures must literally contain
# the confusables the normalizer folds. Same rationale as app/core/normalize.py.
"tests/unit/test_normalize.py" = ["RUF001", "RUF002", "RUF003"]
# Tests legitimately use assert and fake credentials.
"tests/**" = ["S101", "S105", "S106", "S311"]
"eval/**" = ["S101"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/", "^build/"]

[[tool.mypy.overrides]]
module = ["tests.*", "eval.*"]
disallow_untyped_defs = false

# Not installed by default - they live in the `retrieval` extra (ADR-006).
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "unit: pure logic, no I/O",
    "api: exercises the ASGI app in-process",
    "security: security-critical behaviour (containment, fail-closed, leakage, boundaries)",
    "integration: requires PostgreSQL and/or the llm-firewall",
    "evaluation: exercises the evaluation harness; no model calls",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
